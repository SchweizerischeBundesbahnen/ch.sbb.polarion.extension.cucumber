<!-- Cucumber Test work-item panel. Polarion (CucumberIntegrationFormExtension) injects this fragment
  into the form. On load the React panel bundle is imported and mounts into a SHADOW ROOT on the div
  below (see ui/src/formext/mount.tsx). It injects its own styles into that shadow root -
  react-sbb-polarion's bundled stylesheet plus the panel CSS (petrel.css / highlightjs.css /
  cucumber.css) - so the panel's CSS is fully encapsulated and cannot clash with other extensions'
  panels on the shared form. The <link> below loads a tiny empty stylesheet (starter.css) that exists
  only to fire the bundle-import trigger via its onload handler - an inline module script would not run
  inside a GWT-injected fragment. The panel context is passed on the host div's data-* attributes (read
  by mountCucumberPanel); the feature itself is fetched by the panel, not inlined here. -->
<link rel='stylesheet' href='/polarion/cucumber/ui/css/starter.css?bundle={BUNDLE}'
      onload='import("/polarion/cucumber-app/ui/app/assets/cucumberPanel.js")
                .then(module => module.mountCucumberPanel("#cucumber-edit-panel"))
                .catch(console.error);'>

<div id="cucumber-edit-panel"
     data-project-id="{PROJECT_ID}"
     data-work-item-id="{WORK_ITEM_ID}"
     data-file-name="{FILENAME}"
     data-validate-on-save="{VALIDATE}"></div>
